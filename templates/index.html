<!DOCTYPE html>
<html>
<head>

    <title>Real-Time Chat Application</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>Real Time Chat</h1>

    <input
    type="text"
    id="username"
    placeholder="Enter Username">

    <button onclick="joinChat()">
        Join Chat
    </button>

</div>

<script>

function joinChat(){

    let username =
    document.getElementById("username").value;

    if(username.trim() == ""){

        alert("Enter Username");
        return;
    }

    window.location.href =
    "/chat?username=" + username;
}

</script>

</body>
</html>
